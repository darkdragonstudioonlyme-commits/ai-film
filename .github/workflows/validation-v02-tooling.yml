name: Validation V02 Tooling

on:
  push:
    branches:
      - lane/validation-p00
      - 'lane/validation-p00-v02-*'
    paths:
      - 'validation/tooling/**'
      - '.github/workflows/validation-v02-tooling.yml'
  pull_request:
    paths:
      - 'validation/tooling/**'
      - '.github/workflows/validation-v02-tooling.yml'

permissions:
  contents: read

jobs:
  v02-portable-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portable tooling dependency
        run: python -m pip install cryptography
      - name: Python compile
        run: python -m py_compile validation/tooling/*.py validation/tooling/tests/*.py
      - name: Shell syntax
        run: bash -n validation/tooling/*.sh
      - name: External authenticity regression
        run: python validation/tooling/tests/test_v02_external_authenticity.py
      - name: Preflight byte-integrity regression
        run: python validation/tooling/tests/test_v02_preflight_content_integrity.py
      - name: Watcher fail-closed regression
        run: python validation/tooling/tests/test_v02_watcher_failclosed.py
      - name: Pre-V03 policy fail-closed regression
        run: python validation/tooling/tests/test_v02_pre_v03_failclosed.py
      - name: Tooling manifest integrity
        run: python validation/tooling/tests/test_v02_tooling_manifest.py
      - name: Exact-source regression remains review-gated
        run: |
          echo 'test_v02_hardened_validator.py requires exact dev21 source authority.'
          echo 'GitHub repository source is ARTIFACT_ONLY/non-authoritative for current dev21.'
          echo 'Run that regression in the exact reviewed validation workspace before promotion.'
