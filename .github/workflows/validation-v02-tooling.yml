name: Validation V02 Tooling

on:
  push:
    branches:
      - lane/validation-p00
      - 'lane/validation-p00-v02-*'
    paths:
      - 'validation/tooling/**'
      - 'validation/V02_*.md'
      - 'workflow-health/HEALTH_REVIEW-WF-P00-V02-*.md'
      - 'reviews/VALIDATION-V02-*.md'
      - 'LANE_STATE.md'
      - 'workflow-runs/RUN-P00-VALIDATION-001.md'
      - '.github/workflows/validation-v02-tooling.yml'
  pull_request:
    paths:
      - 'validation/tooling/**'
      - 'validation/V02_*.md'
      - 'workflow-health/HEALTH_REVIEW-WF-P00-V02-*.md'
      - 'reviews/VALIDATION-V02-*.md'
      - 'LANE_STATE.md'
      - 'workflow-runs/RUN-P00-VALIDATION-001.md'
      - '.github/workflows/validation-v02-tooling.yml'

permissions:
  contents: read

jobs:
  v02-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling dependency
        run: python -m pip install cryptography
      - name: Python compile
        run: python -m py_compile validation/tooling/*.py validation/tooling/tests/*.py
      - name: Shell syntax
        run: bash -n validation/tooling/*.sh
      - name: External authenticity regression
        run: python validation/tooling/tests/test_v02_external_authenticity.py
      - name: Preflight byte-integrity regression
        run: python validation/tooling/tests/test_v02_preflight_content_integrity.py
      - name: Watcher fail-closed regression
        run: python validation/tooling/tests/test_v02_watcher_failclosed.py
      - name: Pre-V03 policy fail-closed regression
        run: python validation/tooling/tests/test_v02_pre_v03_failclosed.py
      - name: Tooling manifest integrity
        run: python validation/tooling/tests/test_v02_tooling_manifest.py
      - name: Checkout exact dev21 source authority
        uses: actions/checkout@v4
        with:
          ref: 934659f535d81d9a4a07389531acc2b9c304fa6d
          path: exact-source
      - name: Verify exact dev21 source identity
        run: |
          test "$(git -C exact-source rev-parse HEAD)" = "934659f535d81d9a4a07389531acc2b9c304fa6d"
          test -f exact-source/src/aifilm_p00/__init__.py
      - name: Bind exact source to reviewed runtime path
        run: |
          sudo mkdir -p /home/dragon/ai-film-dev/validation
          sudo ln -s "$GITHUB_WORKSPACE/exact-source/src" /home/dragon/ai-film-dev/validation/src
          test -f /home/dragon/ai-film-dev/validation/src/aifilm_p00/__init__.py
      - name: Exact-source hardened validator regression
        run: python validation/tooling/tests/test_v02_hardened_validator.py
