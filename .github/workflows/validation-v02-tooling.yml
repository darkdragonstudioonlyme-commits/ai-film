name: Validation V02 Tooling

on:
  push:
    branches:
      - lane/validation-p00
      - 'lane/validation-p00-v02-*'
      - 'lane/validation-p00-prodlike-*'
    paths:
      - 'validation/tooling/**'
      - 'validation/V02_*.md'
      - 'validation/PRODLIKE_*.md'
      - 'validation/prodlike-dev22/**'
      - 'validation/WSL_PRODLIKE_*.md'
      - 'workflow-health/HEALTH_REVIEW-WF-P00-V02-*.md'
      - 'workflow-health/HEALTH_REVIEW-WF-P00-PRODLIKE-*.md'
      - 'reviews/VALIDATION-V02-*.md'
      - 'reviews/VALIDATION-PRODLIKE-*.md'
      - 'LANE_STATE.md'
      - 'workflow-runs/RUN-P00-VALIDATION-001.md'
      - 'workflow-runs/RUN-P00-VALIDATION-002.md'
      - '.github/workflows/validation-v02-tooling.yml'
  pull_request:
    paths:
      - 'validation/tooling/**'
      - 'validation/V02_*.md'
      - 'validation/PRODLIKE_*.md'
      - 'validation/prodlike-dev22/**'
      - 'validation/WSL_PRODLIKE_*.md'
      - 'workflow-health/HEALTH_REVIEW-WF-P00-V02-*.md'
      - 'workflow-health/HEALTH_REVIEW-WF-P00-PRODLIKE-*.md'
      - 'reviews/VALIDATION-V02-*.md'
      - 'reviews/VALIDATION-PRODLIKE-*.md'
      - 'LANE_STATE.md'
      - 'workflow-runs/RUN-P00-VALIDATION-001.md'
      - 'workflow-runs/RUN-P00-VALIDATION-002.md'
      - '.github/workflows/validation-v02-tooling.yml'

permissions:
  contents: read

jobs:
  v02-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling dependency
        run: python -m pip install cryptography
      - name: Python compile
        run: python -m py_compile validation/tooling/*.py validation/tooling/tests/*.py
      - name: Shell syntax
        run: bash -n validation/tooling/*.sh
      - name: Local authority signature regression
        run: python validation/tooling/tests/test_v02_local_authority_signature.py
      - name: Local key parity regression
        run: python validation/tooling/tests/test_v02_local_key_parity.py
      - name: Preflight byte-integrity regression
        run: python validation/tooling/tests/test_v02_preflight_content_integrity.py
      - name: Watcher fail-closed regression
        run: python validation/tooling/tests/test_v02_watcher_failclosed.py
      - name: Pre-V03 policy fail-closed regression
        run: python validation/tooling/tests/test_v02_pre_v03_failclosed.py
      - name: Tooling manifest integrity
        run: python validation/tooling/tests/test_v02_tooling_manifest.py
      - name: Prodlike user-systemd verifier regression
        run: python validation/tooling/tests/test_prodlike_user_systemd_verifier.py
      - name: Prodlike dev22 control bundle regression
        run: python validation/tooling/tests/test_prodlike_dev22_control_bundle.py
      - name: Prodlike dev22 release builder regression
        run: python validation/tooling/tests/test_prodlike_dev22_release_builder.py
      - name: Prodlike dev22 bundled script syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for p in Path('validation/prodlike-dev22/scripts').glob('*.py'):
              ast.parse(p.read_text(), filename=str(p))
          PY
          bash -n validation/prodlike-dev22/scripts/activate-release validation/prodlike-dev22/scripts/verify-current validation/prodlike-dev22/scripts/verify-recovery-state
      - name: Checkout exact dev22 source authority
        uses: actions/checkout@v4
        with:
          ref: 86bb64938a136e3f8d6cfd0266685a01cb832b77
          path: exact-source
          persist-credentials: false
      - name: Verify checkout credentials are not persisted
        run: |
          ! git config --local --get-regexp '^http\..*\.extraheader$'
          ! git -C exact-source config --local --get-regexp '^http\..*\.extraheader$'
      - name: Verify exact dev22 source identity
        run: |
          test "$(git -C exact-source rev-parse HEAD)" = "86bb64938a136e3f8d6cfd0266685a01cb832b77"
          test -f exact-source/src/aifilm_p00/__init__.py
      - name: Bind exact source to reviewed runtime path
        run: |
          sudo mkdir -p /home/dragon/ai-film-dev/validation
          sudo ln -s "$GITHUB_WORKSPACE/exact-source/src" /home/dragon/ai-film-dev/validation/src
          test -f /home/dragon/ai-film-dev/validation/src/aifilm_p00/__init__.py
      - name: Exact-source hardened validator regression
        run: python validation/tooling/tests/test_v02_hardened_validator.py
