name: Author V41 V02 Authenticity Reconciliation

on:
  push:
    branches:
      - lane/docs-v2-r9-v41-v02-auth-design
    paths:
      - '.github/workflows/v02-auth-doc-design-author.yml'

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Author exact reconciliation tree
        run: python3 tools/author_v02_auth_reconciliation.py
      - name: Validate authored candidate
        run: |
          python3 tools/check_learning_lifecycle.py
          python3 tools/test_learning_lifecycle_checker.py
          python3 tools/check_documentation_governance.py
          python3 tools/check_project_docs.py
          python3 tools/test_project_docs_checker.py
          python3 tools/check_workflow_continuity.py
          python3 tools/audit_documentation_v2.py
          git diff --check
      - name: Commit final design tree
        run: |
          rm -f .github/workflows/v02-auth-doc-design-author.yml tools/author_v02_auth_reconciliation.py
          git config user.name 'darkdragonstudioonlyme-commits'
          git config user.email 'darkdragon.studio.onlyme@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(r9): reconcile V02 external authenticity boundary'
          git push origin HEAD:lane/docs-v2-r9-v41-v02-auth-design
